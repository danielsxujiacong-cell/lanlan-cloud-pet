<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf5ff" />
    <meta name="description" content="来云端看看蓝蓝，给她投喂一份小鱼干。" />
    <title>蓝蓝的小窝</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script src="supabase-config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="home" aria-labelledby="page-title">
      <header class="topbar">
        <a class="brand" href="./" aria-label="蓝蓝的小窝首页">
          <span class="brand-mark" aria-hidden="true">☁️</span>
          <span>蓝蓝的小窝</span>
        </a>
        <span class="online-pill"><span class="online-dot"></span>云端小窝</span>
      </header>
      <section class="pet-scene" aria-label="蓝蓝">
        <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-two" aria-hidden="true">✧</span>
        <span class="cloud cloud-left" aria-hidden="true"></span>
        <span class="cloud cloud-right" aria-hidden="true"></span>
        <div class="pet-frame" id="pet-frame">
          <div class="pet-shadow" aria-hidden="true"></div>
          <div class="pet-sprite" id="pet-sprite" role="img" aria-label="蓝蓝，一只灰蓝色的小猫"></div>
          <span class="feed-float" id="feed-float" aria-hidden="true">+1 🍗</span>
        </div>
        <p class="pet-caption">今天也来陪蓝蓝一会儿吧</p>
      </section>
      <span class="feed-flight" id="feed-flight" aria-hidden="true">🍗</span>
      <span class="feed-particles" id="feed-particles" aria-hidden="true"><span>❤️</span><span>😽</span><span>✨</span></span>
      <section class="feed-section" aria-label="投喂蓝蓝">
        <h1 id="page-title">蓝蓝在等你呢 <span aria-hidden="true">🐾</span></h1>
        <p class="subtitle">每一份小鱼干，都是喜欢的形状</p>
        <button class="feed-button" id="feed-button" type="button">
          <span class="feed-icon" aria-hidden="true">🍗</span>
          <span>投喂蓝蓝</span>
          <span class="button-sparkle" aria-hidden="true">✦</span>
        </button>
        <p class="feed-status" id="feed-status" role="status" aria-live="polite">正在连接云端…</p>
      </section>
      <section class="stats" aria-label="蓝蓝的投喂统计">
        <div class="stat-card">
          <span class="stat-icon" aria-hidden="true">🍗</span>
          <div><strong id="total-count">—</strong><span>蓝蓝累计收到</span></div>
          <span class="stat-unit">次</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon sun" aria-hidden="true">🌞</span>
          <div><strong id="today-count">—</strong><span>今天收到投喂</span></div>
          <span class="stat-unit">次</span>
        </div>
      </section>
      <footer class="footer-note">一口小鱼干，一点点好心情 <span aria-hidden="true">☁️</span></footer>
    </main>
  </body>
</html>
